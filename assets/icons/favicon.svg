<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Pic2PDF app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b30" />
      <stop offset="1" stop-color="#b31313" />
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a7e" />
      <stop offset="1" stop-color="#e24a3f" />
    </linearGradient>
  </defs>
  <!-- Red fills entire icon — no white, no borders -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- Fold accent, same style as page logo -->
  <path d="M40 0h24v24L40 0z" fill="url(#fold)" />
  <!-- App mark: bold "P2P" -->
  <text x="32" y="46" text-anchor="middle" font-size="22" font-family="Outfit, system-ui, sans-serif" font-weight="800" fill="#ffffff">P2P</text>
</svg>
