<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta
      name="description"
      content="Extract PDF pages as images or split into separate PDFs. All in your browser. Nothing leaves your device."
    />
    <link rel="manifest" href="../../manifest.json" />
    <title>Unfold · Origami Docs</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="../../shared/tool-ui.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="brand">
          <span class="badge" aria-hidden="true">
            <svg class="logo" viewBox="0 0 64 80" role="img" aria-label="UNF">
              <defs>
                <linearGradient id="pdfBody" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff3b30" />
                  <stop offset="1" stop-color="#b31313" />
                </linearGradient>
                <linearGradient id="pdfFold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff8a7e" />
                  <stop offset="1" stop-color="#e24a3f" />
                </linearGradient>
              </defs>
              <!-- spreading output pages -->
              <rect x="3" y="18" width="20" height="28" rx="5" fill="url(#pdfBody)" opacity="0.35" />
              <rect x="41" y="18" width="20" height="28" rx="5" fill="url(#pdfBody)" opacity="0.35" />
              <!-- main PDF -->
              <rect x="14" y="10" width="36" height="50" rx="7" fill="url(#pdfBody)" />
              <path d="M42 10l8 8H42z" fill="url(#pdfFold)" />
              <path d="M22 34h20M22 43h20" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
              <text x="32" y="78" text-anchor="middle" font-size="11" font-family="Outfit, system-ui, sans-serif" font-weight="800" fill="#ffffff">UNF</text>
            </svg>
          </span>
          <h1>Unfold</h1>
        </div>
        <p>One PDF in — pages as images or split into PDFs. Nothing leaves your device.</p>
      </header>

      <section class="panel">
        <div id="dropZone" class="drop">
          <label class="file-btn">
            <input id="fileInput" type="file" accept="application/pdf,.pdf" />
            Choose a PDF
          </label>
          <p id="emptyState" class="empty-state">Drop a PDF or tap to choose</p>
          <p class="hint">Select pages to skip · <kbd>⌘E</kbd> to export</p>
        </div>

        <!-- Mode toggle -->
        <div class="controls controls-bar">
          <div class="select inline">
            <label for="modeSelect">Output</label>
            <select id="modeSelect">
              <option value="images">Images (PNG / JPG / WebP)</option>
              <option value="pdfs">Split into PDFs</option>
            </select>
          </div>
        </div>

        <!-- Image options -->
        <div class="controls controls-bar" id="imageControls">
          <div class="select inline">
            <label for="formatSelect">Format</label>
            <select id="formatSelect">
              <option value="png" selected>PNG</option>
              <option value="jpeg">JPG</option>
              <option value="webp">WebP</option>
            </select>
          </div>
          <div class="select inline">
            <label for="scaleSelect">Scale</label>
            <select id="scaleSelect">
              <option value="1">1×</option>
              <option value="2" selected>2×</option>
              <option value="3">3× (high DPI)</option>
            </select>
          </div>
          <div class="select range" id="qualityWrap">
            <label for="qualityRange">Quality <span id="qualityValue">0.92</span></label>
            <input id="qualityRange" type="range" min="0.5" max="1" step="0.02" value="0.92" />
          </div>
        </div>

        <!-- Split PDF options -->
        <div class="controls controls-bar" id="pdfControls" hidden>
          <div class="select inline">
            <label for="splitSelect">Split by</label>
            <select id="splitSelect">
              <option value="pages" selected>Every page</option>
              <option value="ranges">Custom ranges</option>
              <option value="chunks">Fixed chunks</option>
            </select>
          </div>
          <div class="field" id="rangeField" hidden>
            <input id="rangeInput" class="name-input" type="text" placeholder="e.g. 1-3, 5, 8-10" />
          </div>
          <div class="select inline" id="chunkField" hidden>
            <label for="chunkInput">Pages per file</label>
            <input id="chunkInput" class="name-input" type="number" min="1" value="2" style="width:70px" />
          </div>
        </div>

        <!-- Export bar -->
        <div class="controls controls-bar">
          <label for="fileNameInput" class="field-tag">Filename</label>
          <input id="fileNameInput" class="name-input" type="text" placeholder="unfold.zip" />
          <button id="exportBtn" class="primary" disabled>Export</button>
          <button id="clearBtn" class="ghost" disabled>Clear</button>
        </div>

        <div id="pages" class="pages" aria-live="polite"></div>

        <div class="status">
          <div class="status-left">
            <span id="count">No PDF loaded</span>
            <progress id="progress" value="0" max="1" hidden></progress>
          </div>
          <div class="status-right">
            <span id="status"></span>
          </div>
        </div>
      </section>
    </main>

    <script src="../../shared/vendor/pdf-lib.min.js"></script>
    <script src="../../shared/vendor/pdfjs/pdf.min.js"></script>
    <script src="../../shared/vendor/jszip.min.js"></script>
    <script src="app.js"></script>
    <script src="../../shared/shell.js"></script>
    <script>
      Shell.mount({ tool: "Unfold", rootHref: "../../" });
    </script>
  </body>
</html>
