<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta
      name="description"
      content="Knot — QR code generator. Rounded dots, custom colours, optional center logo. Nothing leaves your device."
    />
    <link rel="manifest" href="../../manifest.json" />
    <title>Knot · Origami Docs</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="../../shared/tool-ui.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="brand">
          <span class="badge" aria-hidden="true">
            <svg class="logo" viewBox="0 0 64 80" role="img" aria-label="KNT">
              <defs>
                <linearGradient id="pdfBody" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#5DBD8A" />
                  <stop offset="1" stop-color="#2D7A56" />
                </linearGradient>
                <clipPath id="ic"><rect x="4" y="4" width="56" height="56" rx="16" /></clipPath>
              </defs>
              <!-- Square squircle — QR codes are inherently square -->
              <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#pdfBody)" />
              <!-- Finder: top-left -->
              <rect x="10" y="10" width="13" height="13" rx="2" fill="#ffffff" clip-path="url(#ic)" />
              <rect x="13" y="13" width="7" height="7" rx="1" fill="url(#pdfBody)" clip-path="url(#ic)" />
              <!-- Finder: top-right -->
              <rect x="41" y="10" width="13" height="13" rx="2" fill="#ffffff" clip-path="url(#ic)" />
              <rect x="44" y="13" width="7" height="7" rx="1" fill="url(#pdfBody)" clip-path="url(#ic)" />
              <!-- Finder: bottom-left -->
              <rect x="10" y="41" width="13" height="13" rx="2" fill="#ffffff" clip-path="url(#ic)" />
              <rect x="13" y="44" width="7" height="7" rx="1" fill="url(#pdfBody)" clip-path="url(#ic)" />
              <!-- Data cells (bottom-right quadrant) -->
              <rect x="27" y="27" width="4" height="4" rx="1" fill="#ffffff" />
              <rect x="33" y="27" width="4" height="4" rx="1" fill="#ffffff" opacity="0.8" />
              <rect x="39" y="27" width="4" height="4" rx="1" fill="#ffffff" />
              <rect x="45" y="27" width="4" height="4" rx="1" fill="#ffffff" opacity="0.6" />
              <rect x="27" y="33" width="4" height="4" rx="1" fill="#ffffff" opacity="0.7" />
              <rect x="33" y="33" width="4" height="4" rx="1" fill="#ffffff" />
              <rect x="45" y="33" width="4" height="4" rx="1" fill="#ffffff" />
              <rect x="27" y="41" width="4" height="4" rx="1" fill="#ffffff" />
              <rect x="33" y="41" width="4" height="4" rx="1" fill="#ffffff" opacity="0.6" />
              <rect x="39" y="41" width="4" height="4" rx="1" fill="#ffffff" opacity="0.8" />
              <rect x="45" y="41" width="4" height="4" rx="1" fill="#ffffff" />
              <rect x="27" y="47" width="4" height="4" rx="1" fill="#ffffff" opacity="0.8" />
              <rect x="39" y="47" width="4" height="4" rx="1" fill="#ffffff" />
              <rect x="45" y="47" width="4" height="4" rx="1" fill="#ffffff" opacity="0.7" />
              <text x="32" y="78" text-anchor="middle" font-size="11" font-family="Outfit, system-ui, sans-serif" font-weight="800" fill="#ffffff">KNT</text>
            </svg>
          </span>
          <h1>Knot</h1>
        </div>
        <p>QR code generator. Rounded dots, custom colours, optional center logo. Nothing leaves your device.</p>
      </header>

      <section class="panel qr-layout">
        <div class="qr-controls">
          <div class="field">
            <label for="dataInput" class="field-tag">Text or URL</label>
            <textarea
              id="dataInput"
              rows="3"
              placeholder="https://example.com or any text"
            >https://origami.dev</textarea>
          </div>

          <div class="field-row">
            <div class="select">
              <label for="dotStyle">Dot style</label>
              <select id="dotStyle">
                <option value="rounded" selected>Rounded</option>
                <option value="square">Square</option>
                <option value="dots">Dots</option>
                <option value="classy">Classy</option>
                <option value="classy-rounded">Classy rounded</option>
                <option value="extra-rounded">Extra rounded</option>
              </select>
            </div>
            <div class="select">
              <label for="cornerStyle">Corner style</label>
              <select id="cornerStyle">
                <option value="extra-rounded" selected>Extra rounded</option>
                <option value="square">Square</option>
                <option value="dot">Dot</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="select color">
              <label for="dotColor">Dot color</label>
              <input id="dotColor" type="color" value="#171717" />
            </div>
            <div class="select color">
              <label for="bgColor">Background</label>
              <input id="bgColor" type="color" value="#ffffff" />
            </div>
            <button id="bgTransparent" class="ghost small" type="button" title="Transparent background">
              Transparent
            </button>
          </div>

          <div class="field-row">
            <div class="select">
              <label for="errorLevel">Error correction</label>
              <select id="errorLevel">
                <option value="L">Low (7%)</option>
                <option value="M" selected>Medium (15%)</option>
                <option value="Q">Quartile (25%)</option>
                <option value="H">High (30%)</option>
              </select>
            </div>
            <div class="select range">
              <label for="marginInput">Quiet zone <span id="marginValue">10</span></label>
              <input id="marginInput" type="range" min="0" max="40" step="2" value="10" />
            </div>
          </div>

          <div class="field">
            <label class="field-tag">Center logo (optional)</label>
            <div class="logo-row">
              <label class="file-btn-small">
                <input id="logoInput" type="file" accept="image/*" />
                Upload
              </label>
              <button id="removeLogo" class="ghost small" type="button" disabled>Remove</button>
              <div class="select range">
                <label for="logoSize">Size <span id="logoSizeValue">0.30</span></label>
                <input id="logoSize" type="range" min="0.1" max="0.5" step="0.02" value="0.3" />
              </div>
            </div>
            <p class="hint">Adding a logo auto-bumps error correction to High so the code still scans.</p>
          </div>
        </div>

        <div class="qr-preview">
          <div id="preview" class="qr-preview-mount" aria-live="polite"></div>

          <div class="qr-export">
            <div class="field-row">
              <div class="select range">
                <label for="sizeInput">Export size <span id="sizeValue">512</span> px</label>
                <input id="sizeInput" type="range" min="128" max="2048" step="32" value="512" />
              </div>
            </div>
            <div class="field-row">
              <label for="fileNameInput" class="field-tag">Filename</label>
              <input id="fileNameInput" class="name-input" type="text" placeholder="qrcode" />
            </div>
            <div class="qr-export-buttons">
              <button id="downloadPng" class="primary" type="button">PNG</button>
              <button id="downloadSvg" type="button">SVG</button>
              <button id="downloadJpg" type="button">JPG</button>
            </div>
            <div class="status">
              <span id="status"></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="../../shared/vendor/qr-code-styling.js"></script>
    <script src="app.js"></script>
    <script src="../../shared/shell.js"></script>
    <script>
      Shell.mount({ tool: "Knot", rootHref: "../../" });
    </script>
  </body>
</html>
