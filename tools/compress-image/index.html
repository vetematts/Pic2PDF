<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta
      name="description"
      content="Compress images in your browser. Adjust quality and dimensions, no upload needed. Nothing leaves your device."
    />
    <link rel="manifest" href="../../manifest.json" />
    <title>Compress Image · Origami Docs</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="../../shared/tool-ui.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="brand">
          <span class="badge" aria-hidden="true">
            <svg class="logo" viewBox="0 0 64 80" role="img" aria-label="CMP">
              <defs>
                <linearGradient id="pdfBody" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#7B9EE8" />
                  <stop offset="1" stop-color="#4A6BC4" />
                </linearGradient>
                <clipPath id="ic"><rect x="4" y="4" width="56" height="56" rx="16" /></clipPath>
              </defs>
              <!-- Square squircle — not a document page -->
              <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#pdfBody)" />
              <!-- Sun -->
              <circle cx="15" cy="17" r="7" fill="#ffffff" opacity="0.9" clip-path="url(#ic)" />
              <!-- Mountain landscape fills square -->
              <path d="M0 60 L18 34 L28 46 L40 28 L70 60 Z" fill="#ffffff" opacity="0.75" clip-path="url(#ic)" />
              <!-- Compress: arrows pointing inward toward each other -->
              <path d="M8 66 L26 66" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />
              <path d="M22 62 L26 66 L22 70" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <path d="M56 66 L38 66" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />
              <path d="M42 62 L38 66 L42 70" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <text x="32" y="78" text-anchor="middle" font-size="11" font-family="Outfit, system-ui, sans-serif" font-weight="800" fill="#ffffff">CMP</text>
            </svg>
          </span>
          <h1>Compress Image</h1>
        </div>
        <p>Shrink images right in your browser. Nothing leaves your device.</p>
      </header>

      <section class="panel">
        <div id="dropZone" class="drop">
          <label class="file-btn">
            <input
              id="fileInput"
              type="file"
              accept="image/png,image/jpeg,image/webp"
              multiple
            />
            Add images
          </label>
          <p id="emptyState" class="empty-state">Drop images or tap to choose</p>
          <p class="hint">JPG · PNG · WebP · click × to skip · ⌘E to export</p>
        </div>

        <div class="controls">
          <div class="select inline">
            <label for="formatSelect">Format</label>
            <select id="formatSelect">
              <option value="auto" selected>Keep original</option>
              <option value="jpeg">JPG</option>
              <option value="webp">WebP</option>
              <option value="png">PNG</option>
            </select>
          </div>
          <div class="select range">
            <label for="qualityRange">Quality <span id="qualityValue">0.80</span></label>
            <input id="qualityRange" type="range" min="0.3" max="1" step="0.02" value="0.8" />
          </div>
          <div class="select inline">
            <label for="maxDimSelect">Max dimension</label>
            <select id="maxDimSelect">
              <option value="0" selected>Original size</option>
              <option value="3000">3000 px</option>
              <option value="2000">2000 px</option>
              <option value="1500">1500 px</option>
              <option value="1000">1000 px</option>
              <option value="800">800 px</option>
            </select>
          </div>
        </div>

        <div class="controls">
          <label for="fileNameInput" class="field-tag">Filename</label>
          <input id="fileNameInput" class="name-input" type="text" placeholder="compressed.zip" />
          <button id="exportBtn" class="primary" disabled>Export</button>
          <button id="clearBtn" class="ghost" disabled>Clear</button>
        </div>

        <div id="items" class="items" aria-live="polite"></div>

        <div class="status">
          <span id="count">0 images</span>
          <progress id="progress" value="0" max="1" hidden></progress>
          <span id="status"></span>
        </div>
      </section>
    </main>

    <script src="../../shared/vendor/jszip.min.js"></script>
    <script src="app.js"></script>
    <script src="../../shared/shell.js"></script>
    <script>
      Shell.mount({ tool: "Compress Image", rootHref: "../../" });
    </script>
  </body>
</html>
