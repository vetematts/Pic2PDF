<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta
      name="description"
      content="Merge PDFs and rearrange pages in your browser. Nothing leaves your device."
    />
    <link rel="manifest" href="../../manifest.json" />
    <title>Merge PDF · Origami Docs</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="brand">
          <span class="badge" aria-hidden="true">
            <svg class="logo" viewBox="0 0 64 80" role="img" aria-label="MRG">
              <defs>
                <linearGradient id="pdfBody" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff3b30" />
                  <stop offset="1" stop-color="#b31313" />
                </linearGradient>
                <linearGradient id="pdfFold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff8a7e" />
                  <stop offset="1" stop-color="#e24a3f" />
                </linearGradient>
              </defs>
              <rect x="8" y="6" width="48" height="66" rx="10" fill="url(#pdfBody)" />
              <path d="M44 6l12 12H44z" fill="url(#pdfFold)" />
              <path d="M16 34h32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
              <path d="M16 44h32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
              <path d="M16 54h32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
              <text
                x="32"
                y="68"
                text-anchor="middle"
                font-size="13"
                font-family="Outfit, system-ui, sans-serif"
                font-weight="800"
                fill="#ffffff"
              >
                MRG
              </text>
            </svg>
          </span>
          <h1>Merge PDF</h1>
        </div>
        <p>Combine PDFs and rearrange pages. Nothing leaves your device.</p>
      </header>

      <section class="panel">
        <div id="dropZone" class="drop">
          <label class="file-btn">
            <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple />
            Add PDFs
          </label>
          <p id="emptyState" class="empty-state">Drop PDFs or tap to choose</p>
          <p class="hint">Drag pages to reorder · click × to remove · ⌘E to save</p>
        </div>

        <div class="controls">
          <label for="fileNameInput" class="field-tag">Filename</label>
          <input id="fileNameInput" class="name-input" type="text" placeholder="merged.pdf" />
          <button id="mergeBtn" class="primary" disabled>Save PDF</button>
          <button id="clearBtn" class="ghost" disabled>Clear</button>
        </div>

        <div id="pages" class="pages" aria-live="polite"></div>

        <div class="status">
          <span id="count">0 pages</span>
          <progress id="progress" value="0" max="1" hidden></progress>
          <span id="status"></span>
        </div>
      </section>
    </main>

    <script src="../../shared/vendor/pdf-lib.min.js"></script>
    <script src="../../shared/vendor/pdfjs/pdf.min.js"></script>
    <script src="app.js"></script>
    <script src="../../shared/shell.js"></script>
    <script>
      Shell.mount({ tool: "Merge PDF", rootHref: "../../" });
    </script>
  </body>
</html>
