<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta
      name="description"
      content="Split a PDF into separate files by page, range, or fixed chunks. All in your browser. Nothing leaves your device."
    />
    <link rel="manifest" href="../../manifest.json" />
    <title>Split PDF · Origami Docs</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="../../shared/tool-ui.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="brand">
          <span class="badge" aria-hidden="true">
            <svg class="logo" viewBox="0 0 64 80" role="img" aria-label="SPL">
              <defs>
                <linearGradient id="pdfBody" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff3b30" />
                  <stop offset="1" stop-color="#b31313" />
                </linearGradient>
                <linearGradient id="pdfFold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff8a7e" />
                  <stop offset="1" stop-color="#e24a3f" />
                </linearGradient>
              </defs>
              <rect x="8" y="6" width="48" height="66" rx="10" fill="url(#pdfBody)" />
              <path d="M44 6l12 12H44z" fill="url(#pdfFold)" />
              <!-- split line down the middle -->
              <path
                d="M32 26v30"
                stroke="#ffffff"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-dasharray="3 4"
                opacity="0.95"
              />
              <!-- two halves pulling apart -->
              <path
                d="M26 40l-5 0m2-3l-3 3 3 3M38 40l5 0m-2-3l3 3-3 3"
                stroke="#ffffff"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
                opacity="0.8"
              />
              <text
                x="32"
                y="68"
                text-anchor="middle"
                font-size="12"
                font-family="Outfit, system-ui, sans-serif"
                font-weight="800"
                fill="#ffffff"
              >
                SPL
              </text>
            </svg>
          </span>
          <h1>Split PDF</h1>
        </div>
        <p>One PDF in, many out. Nothing leaves your device.</p>
      </header>

      <section class="panel">
        <div id="dropZone" class="drop">
          <label class="file-btn">
            <input id="fileInput" type="file" accept="application/pdf,.pdf" />
            Choose a PDF
          </label>
          <p id="emptyState" class="empty-state">Drop a PDF or tap to choose</p>
          <p class="hint">Split into single pages, custom ranges, or fixed chunks · <kbd>⌘E</kbd> to export</p>
        </div>

        <div class="controls controls-bar">
          <div class="select inline">
            <label for="modeSelect">Split by</label>
            <select id="modeSelect">
              <option value="pages" selected>Every page</option>
              <option value="ranges">Custom ranges</option>
              <option value="chunks">Fixed chunks</option>
            </select>
          </div>
          <div class="field" id="rangeField" hidden>
            <input
              id="rangeInput"
              class="name-input"
              type="text"
              placeholder="e.g. 1-3, 5, 8-10"
            />
          </div>
          <div class="select inline" id="chunkField" hidden>
            <label for="chunkInput">Pages per file</label>
            <input
              id="chunkInput"
              class="name-input"
              type="number"
              min="1"
              value="2"
              style="width: 70px"
            />
          </div>
        </div>

        <div class="controls controls-bar">
          <label for="fileNameInput" class="field-tag">Filename</label>
          <input id="fileNameInput" class="name-input" type="text" placeholder="split.zip" />
          <button id="exportBtn" class="primary" disabled>Split PDF</button>
          <button id="clearBtn" class="ghost" disabled>Clear</button>
        </div>

        <div id="pages" class="pages" aria-live="polite"></div>

        <div class="status">
          <div class="status-left">
            <span id="count">No PDF loaded</span>
            <progress id="progress" value="0" max="1" hidden></progress>
          </div>
          <div class="status-right">
            <span id="status"></span>
          </div>
        </div>
      </section>
    </main>

    <script src="../../shared/vendor/pdf-lib.min.js"></script>
    <script src="../../shared/vendor/pdfjs/pdf.min.js"></script>
    <script src="../../shared/vendor/jszip.min.js"></script>
    <script src="app.js"></script>
    <script src="../../shared/shell.js"></script>
    <script>
      Shell.mount({ tool: "Split PDF", rootHref: "../../" });
    </script>
  </body>
</html>
