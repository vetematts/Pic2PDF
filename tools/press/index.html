<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta
      name="description"
      content="Crop, convert, and compress images in your browser. Nothing leaves your device."
    />
    <link rel="manifest" href="../../manifest.json" />
    <title>Press · Origami Docs</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="../../shared/tool-ui.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="brand">
          <span class="badge" aria-hidden="true">
            <svg class="logo" viewBox="0 0 64 80" role="img" aria-label="PRS">
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#7B9EE8" />
                  <stop offset="1" stop-color="#4A6BC4" />
                </linearGradient>
                <clipPath id="ic"><rect x="4" y="4" width="56" height="56" rx="16" /></clipPath>
              </defs>
              <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" />
              <circle cx="14" cy="16" r="5" fill="#fff" opacity="0.45" clip-path="url(#ic)" />
              <path d="M4 50 L20 34 L28 42 L38 28 L60 50 Z" fill="#fff" opacity="0.2" clip-path="url(#ic)" />
              <rect x="14" y="15" width="36" height="30" rx="1" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65" clip-path="url(#ic)" />
              <path d="M22 15 L14 15 L14 23  M42 15 L50 15 L50 23" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <path d="M10 58 L18 58" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
              <path d="M14 54 L18 58 L14 62" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <path d="M54 58 L46 58" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
              <path d="M50 54 L46 58 L50 62" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <text x="32" y="78" text-anchor="middle" font-size="11" font-family="Outfit, system-ui, sans-serif" font-weight="800" fill="#ffffff">PRS</text>
            </svg>
          </span>
          <h1>Press</h1>
        </div>
        <p>Crop, convert, and compress images. One image or a batch. Nothing leaves your device.</p>
      </header>

      <section class="panel">
        <div id="dropZone" class="drop">
          <label class="file-btn">
            <input id="fileInput" type="file" accept="image/*,.heic,.heif" multiple />
            Add images
          </label>
          <p id="emptyState" class="empty-state">Drop images or tap to choose</p>
          <p class="hint">JPG · PNG · WebP · HEIC · one image = crop mode · <kbd>⌘E</kbd> to export</p>
        </div>

        <!-- Always-visible controls -->
        <div class="controls controls-bar">
          <div class="select inline">
            <label for="formatSelect">Format</label>
            <select id="formatSelect">
              <option value="auto" selected>Keep original</option>
              <option value="jpeg">JPG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
            </select>
          </div>
          <div class="select range" id="qualityWrap">
            <label for="qualityRange">Quality <span id="qualityValue">0.92</span></label>
            <input id="qualityRange" type="range" min="0.3" max="1" step="0.02" value="0.92" />
          </div>
          <div class="select inline">
            <label for="maxDimSelect">Max size</label>
            <select id="maxDimSelect">
              <option value="0" selected>Original</option>
              <option value="3000">3000 px</option>
              <option value="2000">2000 px</option>
              <option value="1500">1500 px</option>
              <option value="1000">1000 px</option>
              <option value="800">800 px</option>
            </select>
          </div>
        </div>

        <!-- Crop mode only: aspect ratio -->
        <div class="controls controls-bar" id="ratioRow" hidden>
          <div class="select inline">
            <label for="ratioSelect">Aspect ratio</label>
            <select id="ratioSelect">
              <option value="free" selected>Free</option>
              <option value="1:1">Square 1:1</option>
              <option value="4:3">4:3</option>
              <option value="3:2">3:2</option>
              <option value="16:9">16:9</option>
              <option value="2:3">2:3 portrait</option>
              <option value="9:16">9:16 story</option>
            </select>
          </div>
        </div>

        <!-- Export bar -->
        <div class="controls controls-bar">
          <label for="fileNameInput" class="field-tag">Filename</label>
          <input id="fileNameInput" class="name-input" type="text" placeholder="press.zip" />
          <button id="resetBtn" class="ghost" disabled hidden>Reset</button>
          <button id="exportBtn" class="primary" disabled>Export</button>
          <button id="clearBtn" class="ghost" disabled>Clear</button>
        </div>

        <!-- Single-image crop stage -->
        <div id="stage" class="crop-stage" hidden>
          <img id="cropImg" class="crop-img" alt="Image to crop" />
          <div id="cropBox" class="crop-box">
            <span class="handle n"></span>
            <span class="handle s"></span>
            <span class="handle e"></span>
            <span class="handle w"></span>
            <span class="handle ne"></span>
            <span class="handle nw"></span>
            <span class="handle se"></span>
            <span class="handle sw"></span>
          </div>
        </div>

        <!-- Batch image list -->
        <div id="items" class="items" hidden></div>

        <div class="status">
          <div class="status-left">
            <span id="count">No images loaded</span>
            <progress id="progress" value="0" max="1" hidden></progress>
          </div>
          <div class="status-right">
            <span id="status"></span>
          </div>
        </div>
      </section>
    </main>

    <script src="../../shared/vendor/jszip.min.js"></script>
    <script src="../../shared/vendor/heic2any.min.js"></script>
    <script src="app.js"></script>
    <script src="../../shared/shell.js"></script>
    <script>
      Shell.mount({ tool: "Press", rootHref: "../../" });
    </script>
  </body>
</html>
