<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta name="description" content="Combine images into one PDF in your browser. Nothing leaves your device." />
    <link rel="manifest" href="../../manifest.json" />
    <title>Pic2PDF · Origami Docs</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="styles.css?v=20260226" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="brand">
          <span class="badge" aria-hidden="true">
            <svg class="logo" viewBox="0 0 64 80" role="img" aria-label="P2P">
              <defs>
                <linearGradient id="pdfBody" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff3b30" />
                  <stop offset="1" stop-color="#b31313" />
                </linearGradient>
                <linearGradient id="pdfFold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff8a7e" />
                  <stop offset="1" stop-color="#e24a3f" />
                </linearGradient>
              </defs>
              <rect x="8" y="6" width="48" height="66" rx="10" fill="url(#pdfBody)" />
              <path d="M44 6l12 12H44z" fill="url(#pdfFold)" />
              <path d="M16 40h32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
              <path d="M16 50h32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
              <text
                x="32"
                y="66"
                text-anchor="middle"
                font-size="15"
                font-family="Outfit, system-ui, sans-serif"
                font-weight="800"
                fill="#ffffff"
              >
                P2P
              </text>
            </svg>
          </span>
          <h1>Pic2PDF</h1>
        </div>
        <p>Images → one PDF. All in your browser — nothing leaves your device.</p>
      </header>

      <section class="panel">
        <div id="dropZone" class="drop">
          <label class="file-btn">
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple />
            Upload images
          </label>
          <p id="emptyState" class="empty-state">Drop images or tap to choose</p>
          <p class="hint">JPG, PNG, WebP · Reorder by dragging · <kbd>⌘E</kbd> to export</p>
        </div>

        <div class="controls sticky-bar" id="controls">
          <div class="controls-core">
            <button id="advancedToggle" class="ghost" type="button" aria-expanded="false">
              Advanced
            </button>
          </div>
          <div class="controls-actions">
            <label for="fileNameInput" class="field-tag">Title</label>
            <input id="fileNameInput" class="name-input" type="text" value="" placeholder="pic2pdf.pdf" />
            <button id="exportBtn" class="primary" disabled>Export PDF</button>
            <button id="clearBtn" class="ghost" disabled>Clear</button>
          </div>
          <div class="controls-advanced">
            <div class="advanced-inner">
              <div class="select inline advanced">
                <label for="pageSize">Page size</label>
                <select id="pageSize">
                  <option value="auto" selected>Auto</option>
                  <option value="a4">A4</option>
                  <option value="letter">Letter</option>
                </select>
              </div>
              <div class="select advanced">
                <label for="fitMode">Fit mode</label>
                <select id="fitMode">
                  <option value="contain" selected>Contain</option>
                  <option value="cover">Cover</option>
                </select>
              </div>
              <div class="select advanced">
                <label for="margin">Margin</label>
                <select id="margin">
                  <option value="0" selected>0 pt</option>
                  <option value="12">12 pt</option>
                  <option value="24">24 pt</option>
                  <option value="36">36 pt</option>
                  <option value="48">48 pt</option>
                </select>
              </div>
              <div class="select color advanced">
                <label for="pageBg">Page color</label>
                <input id="pageBg" type="color" value="#ffffff" />
              </div>
              <div class="select advanced">
                <label for="downscale">Downscale</label>
                <select id="downscale">
                  <option value="0">Original</option>
                  <option value="3000">Max 3000px</option>
                  <option value="2000" selected>Max 2000px</option>
                  <option value="1200">Max 1200px</option>
                </select>
              </div>
              <div class="select range advanced">
                <label for="quality">Quality <span id="qualityValue">0.9</span></label>
                <input id="quality" type="range" min="0.6" max="1" step="0.05" value="0.9" />
              </div>
              <label class="toggle advanced">
                <input id="showSizes" type="checkbox" />
                <span>Show sizes</span>
              </label>
              <button id="resetDefaults" class="ghost small advanced" type="button">
                Reset defaults
              </button>
            </div>
          </div>
        </div>

        <ul id="list" class="list" aria-live="polite"></ul>

        <div class="status">
          <div class="status-left">
            <span id="count">0 images</span>
            <progress id="progress" value="0" max="1" hidden></progress>
            <span id="estimate" class="estimate">Estimated: --</span>
          </div>
          <div class="status-right">
            <span id="status"></span>
            <button id="dismissStatus" class="ghost small" hidden>Clear status</button>
          </div>
        </div>
      </section>

    </main>

    <script src="../../shared/vendor/pdf-lib.min.js"></script>
    <script src="app.js?v=20260226"></script>
    <script src="../../shared/shell.js"></script>
    <script>
      Shell.mount({ tool: "Pic2PDF", rootHref: "../../" });
    </script>
  </body>
</html>
