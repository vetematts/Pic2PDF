<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta
      name="description"
      content="Convert HEIC, JPG, PNG, or WebP images to any other image format. All in your browser. Nothing leaves your device."
    />
    <link rel="manifest" href="../../manifest.json" />
    <title>Convert Image · Origami Docs</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="../../shared/tool-ui.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div class="brand">
          <span class="badge" aria-hidden="true">
            <svg class="logo" viewBox="0 0 64 80" role="img" aria-label="CNV">
              <defs>
                <linearGradient id="pdfBody" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#7B9EE8" />
                  <stop offset="1" stop-color="#4A6BC4" />
                </linearGradient>
                <clipPath id="ic"><rect x="4" y="4" width="56" height="56" rx="16" /></clipPath>
              </defs>
              <!-- Square squircle — not a document page -->
              <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#pdfBody)" />
              <!-- source photo frame (filled = current format) -->
              <rect x="9" y="21" width="17" height="20" rx="3" fill="#ffffff" opacity="0.95" clip-path="url(#ic)" />
              <path d="M12 36 L17 28 L20 31 L23 25 L23 36 Z" fill="#4A6BC4" opacity="0.8" clip-path="url(#ic)" />
              <!-- conversion arrow -->
              <path d="M28 31 L36 31 M32 27 L36 31 L32 35" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <!-- target photo frame (outline = new format) -->
              <rect x="38" y="21" width="17" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2" clip-path="url(#ic)" />
              <path d="M41 36 L46 28 L49 31 L52 25 L52 36 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" clip-path="url(#ic)" />
              <text x="32" y="78" text-anchor="middle" font-size="11" font-family="Outfit, system-ui, sans-serif" font-weight="800" fill="#ffffff">CNV</text>
            </svg>
          </span>
          <h1>Convert Image</h1>
        </div>
        <p>HEIC → JPG and everything in between. Nothing leaves your device.</p>
      </header>

      <section class="panel">
        <div id="dropZone" class="drop">
          <label class="file-btn">
            <input
              id="fileInput"
              type="file"
              accept="image/*,.heic,.heif"
              multiple
            />
            Add images
          </label>
          <p id="emptyState" class="empty-state">Drop images or tap to choose</p>
          <p class="hint">HEIC · JPG · PNG · WebP · click × to skip · ⌘E to export</p>
        </div>

        <div class="controls">
          <div class="select inline">
            <label for="formatSelect">Output format</label>
            <select id="formatSelect">
              <option value="jpeg" selected>JPG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
            </select>
          </div>
          <div class="select range" id="qualityWrap">
            <label for="qualityRange">Quality <span id="qualityValue">0.92</span></label>
            <input id="qualityRange" type="range" min="0.3" max="1" step="0.02" value="0.92" />
          </div>
          <div class="select inline">
            <label for="maxDimSelect">Max dimension</label>
            <select id="maxDimSelect">
              <option value="0" selected>Original size</option>
              <option value="3000">3000 px</option>
              <option value="2000">2000 px</option>
              <option value="1500">1500 px</option>
              <option value="1000">1000 px</option>
            </select>
          </div>
        </div>

        <div class="controls">
          <label for="fileNameInput" class="field-tag">Filename</label>
          <input id="fileNameInput" class="name-input" type="text" placeholder="converted.zip" />
          <button id="exportBtn" class="primary" disabled>Export</button>
          <button id="clearBtn" class="ghost" disabled>Clear</button>
        </div>

        <div id="items" class="items" aria-live="polite"></div>

        <div class="status">
          <span id="count">0 images</span>
          <progress id="progress" value="0" max="1" hidden></progress>
          <span id="status"></span>
        </div>
      </section>
    </main>

    <script src="../../shared/vendor/jszip.min.js"></script>
    <script src="../../shared/vendor/heic2any.min.js"></script>
    <script src="app.js"></script>
    <script src="../../shared/shell.js"></script>
    <script>
      Shell.mount({ tool: "Convert Image", rootHref: "../../" });
    </script>
  </body>
</html>
