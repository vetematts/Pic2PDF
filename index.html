<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <meta
      name="description"
      content="Origami — fast, private, browser-only file tools. Nothing leaves your device."
    />
    <link rel="manifest" href="manifest.json" />
    <title>Origami · Browser-only file tools</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #171717;
        --ink: #f5f6f7;
        --muted: #b1b1b1;
        --accent: #4aa5ff;
        --accent-hover: #6bb8ff;
        --panel: #202020;
        --border: #343434;
        --soft: #2a2a2a;
        --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f8f9fa;
          --ink: #1a1a1a;
          --muted: #5c5c5c;
          --accent: #2563eb;
          --accent-hover: #3b82f6;
          --panel: #ffffff;
          --border: #e5e7eb;
          --soft: #f1f3f4;
          --focus-ring: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent);
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        font-family: "Outfit", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 120% 80% at 20% 20%, rgba(42, 42, 42, 0.9) 0%, transparent 50%),
          radial-gradient(ellipse 80% 60% at 90% 0%, rgba(74, 165, 255, 0.12), transparent 45%),
          radial-gradient(ellipse 60% 80% at 0% 90%, rgba(255, 70, 70, 0.08), transparent 50%);
        background-color: var(--bg);
        min-height: 100vh;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: light) {
        body {
          background:
            radial-gradient(
              ellipse 100% 70% at 30% 10%,
              rgba(255, 255, 255, 0.9) 0%,
              transparent 50%
            ),
            radial-gradient(ellipse 70% 50% at 95% 5%, rgba(37, 99, 235, 0.08), transparent 45%);
          background-color: var(--bg);
        }
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: clamp(32px, 6vw, 64px) clamp(20px, 4vw, 32px);
      }

      .hero {
        text-align: center;
        margin-bottom: clamp(40px, 6vw, 64px);
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .hero p {
        margin: 12px auto 0;
        max-width: 540px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.125rem);
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }

      .tool-card {
        display: block;
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--ink);
        text-decoration: none;
        transition:
          border-color 120ms ease,
          transform 120ms ease,
          background 120ms ease;
      }

      .tool-card:hover,
      .tool-card:focus-visible {
        border-color: var(--accent);
        transform: translateY(-2px);
        outline: none;
      }

      .tool-card:focus-visible {
        box-shadow: var(--focus-ring);
      }

      .tool-card h2 {
        margin: 0 0 6px;
        font-size: 1.15rem;
        font-weight: 600;
      }

      .tool-card p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .tool-meta {
        display: inline-block;
        font-size: 0.75rem;
        color: var(--muted);
        background: var(--soft);
        padding: 3px 8px;
        border-radius: 999px;
        letter-spacing: 0.02em;
      }

      .tool-card.placeholder {
        cursor: default;
        opacity: 0.6;
        border-style: dashed;
      }

      .tool-card.placeholder:hover {
        border-color: var(--border);
        transform: none;
      }

      .foot {
        margin-top: clamp(48px, 8vw, 80px);
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .foot p {
        margin: 4px 0;
      }

      .foot a {
        color: var(--accent);
        text-decoration: none;
      }

      .foot a:hover,
      .foot a:focus-visible {
        color: var(--accent-hover);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <h1>Origami</h1>
        <p>Fast, private, browser-only file tools. Nothing leaves your device.</p>
      </header>

      <section class="tools" aria-label="Available tools">
        <a class="tool-card" href="tools/pic2pdf/">
          <h2>Pic2PDF</h2>
          <p>Combine JPG, PNG, or WebP images into a single PDF.</p>
          <span class="tool-meta">PDF · Images</span>
        </a>

        <div class="tool-card placeholder" aria-disabled="true">
          <h2>More tools coming</h2>
          <p>Pdf2Pic, Merge PDF, Compress Image, OCR, and more.</p>
        </div>
      </section>

      <footer class="foot">
        <p>100% local · No server · No account</p>
      </footer>
    </main>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
